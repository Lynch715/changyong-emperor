<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>0.43 皇嗣隔离验收</title><style>body{font:20px serif;max-width:800px;margin:3rem auto;padding:1rem;background:#f3e8d2}button,a{display:block;margin:1rem 0;padding:1rem}pre{white-space:pre-wrap}</style><h1>0.43 皇嗣隔离验收</h1><p>此页面只供本地测试，不进入构建。新档沿引擎真实月份模拟到出生要事；出生、取名、立绘在正式界面操作，再从该档逐月推进到十岁。</p><button id="born">打开出生完成的资料快照</button><button id="grown">打开十岁完成的资料快照</button><button id="news">打开真实逐月路径的报喜快照</button><button id="threat">打开真实逐月路径的暗算快照</button><button id="birth">从元年新档逐月推进到出生要事</button><button id="grow">从当前出生档逐月推进到十岁要事</button><button id="restore">恢复验收前该端口的存档</button><a href="/">打开正式游戏</a><pre id="out"></pre><script type="module">
import * as E from '/src/v2/engine.js';import * as F from '/src/v2/family.js';import {journey,resolveAgenda,advance} from '/tests/support/family-journey.mjs';
const backupKey='family-043-test-original';if(!sessionStorage.getItem(backupKey))sessionStorage.setItem(backupKey,JSON.stringify({raw:localStorage.getItem(E.SAVE_KEY),off:localStorage.getItem('changyong-v2-ai-off')}));
const out=document.querySelector('#out');
for(const phase of ['news','threat','born','grown'])document.querySelector('#'+phase).onclick=()=>{const s=journey().snapshots[phase];s.cele=[];E.save(s);localStorage.setItem('changyong-v2-ai-off','1');out.textContent=`已载入${phase}真实月份快照 ${s.year}-${s.month}，请打开正式游戏。`;};
document.querySelector('#birth').onclick=()=>{try{const {snapshots}=journey();const s=snapshots.birth;s.cele=[];E.save(s);localStorage.setItem('changyong-v2-ai-off','1');out.textContent=`元年正月新档已按月推进到 ${s.year}-${s.month}，出生事件在要事首位。种子431，未改日期、好感门槛或受孕概率。点击“打开正式游戏”继续。`;}catch(e){out.textContent=e.stack;}};
document.querySelector('#grow').onclick=()=>{try{const s=E.load(),c=s.children[0];if(!c)throw Error('请先在正式界面完成出生');let guard=0;while(F.childAge(s,c)<10){if(++guard>140)throw Error('超过月份上限');resolveAgenda(s);advance(s);}resolveAgenda(s,{stopAt:'youth'});s.cele=[];E.save(s);out.textContent=`${c.name}已按真实月历长到${F.childAge(s,c)}岁，当前 ${s.year}-${s.month}，出生 ${c.born}。点击“打开正式游戏”处理十岁要事。`;}catch(e){out.textContent=e.stack;}};
document.querySelector('#restore').onclick=()=>{const b=JSON.parse(sessionStorage.getItem(backupKey));b.raw===null?localStorage.removeItem(E.SAVE_KEY):localStorage.setItem(E.SAVE_KEY,b.raw);b.off===null?localStorage.removeItem('changyong-v2-ai-off'):localStorage.setItem('changyong-v2-ai-off',b.off);out.textContent='已恢复验收前的测试端口状态。';};
</script></html>
