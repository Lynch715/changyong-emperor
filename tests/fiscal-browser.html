<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>0.43.2 户部理财隔离验收</title><style>body{font:18px serif;max-width:850px;margin:2rem auto;padding:1rem;background:#efe4cc}button,a{display:block;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap}</style><h1>0.43.2 户部理财隔离验收</h1><p>只在独立 localhost 测试端口操作。样本复现三年二月、国库786.62万两、内帑111.98万两及60道积压，未获知的细节使用默认值，不是玩家真实存档。</p><button id="old">载入截图同等压力旧档（零时辰）</button><button id="work">载入理财操作样本（三时辰）</button><button id="month">正常结算一个月并处理测试剧情</button><button id="restore">恢复验收前测试端口状态</button><a href="/">打开正式游戏</a><pre id="out"></pre><script type="module">
import * as E from '/src/v2/engine.js';import {screenLike} from '/tests/support/fiscal-fixture.mjs';import {resolveAgenda} from '/tests/support/family-journey.mjs';import {confirmAge} from '/src/v2/audience.js';
const out=document.querySelector('#out'),backupKey='fiscal-0432-original';
if(!sessionStorage.getItem(backupKey))sessionStorage.setItem(backupKey,JSON.stringify({raw:localStorage.getItem(E.SAVE_KEY),off:localStorage.getItem('changyong-v2-ai-off')}));
function install(work){const s=screenLike();if(work)s.ap=3;E.save(s);confirmAge();localStorage.setItem('changyong-v2-ai-off','1');out.textContent=`已载入 ${s.year}-${s.month}，国库${s.stats.treasury}，待批${E.memorialCounts(s).pending}，时辰${s.ap}。`;}
document.querySelector('#old').onclick=()=>install(false);document.querySelector('#work').onclick=()=>install(true);
document.querySelector('#month').onclick=()=>{try{const s=E.load();resolveAgenda(s);if(!s.night)E.spendNight(s,null);const r=E.endMonth(s);resolveAgenda(s);s.cele=[];E.save(s);out.textContent=JSON.stringify({now:[s.year,s.month],projects:s.fiscal.projects,treasury:s.stats.treasury,settlement:r.fiscal},null,2);}catch(e){out.textContent=e.stack;}};
document.querySelector('#restore').onclick=()=>{const b=JSON.parse(sessionStorage.getItem(backupKey));b.raw===null?localStorage.removeItem(E.SAVE_KEY):localStorage.setItem(E.SAVE_KEY,b.raw);b.off===null?localStorage.removeItem('changyong-v2-ai-off'):localStorage.setItem('changyong-v2-ai-off',b.off);out.textContent='已恢复原测试端口状态。';};
</script></html>
